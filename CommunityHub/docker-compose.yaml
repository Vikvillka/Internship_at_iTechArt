services:
  db:
    image: postgres:16.0-alpine
    environment:
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_DB: ${DB_NAME}
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5
    ports:
        - "5432:5432"
    volumes:
        - db_data:/var/lib/postgresql/data
  
  commynity_service:
    build:
      context: .
      dockerfile: CommunityHub.API/Dockerfile
    ports:
      - "8080:8080"
    environment: 
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"

      ApiCredentials_Username: ${BASE_USERNAME}
      ApiCredentials_Password: ${BASE_PASSWORD}

    depends_on:
      db:
        condition: service_healthy
  
  gateway:
    build:
      context: ../
      dockerfile: CommunityHub/Gateway.API/Dockerfile
    ports:
      - "8081:8080" 
    environment:
      ApiBaseUrl:  ${API_BASE_URL}

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      Jwt__RefreshTokenLifetimeHours: ${JWT_REFRESH_TOKEN_LIFETIME_HOURS}

      ApiCredentials_Username: ${BASE_USERNAME}
      ApiCredentials_Password: ${BASE_PASSWORD}
    depends_on:
      commynity_service:
        condition: service_started
volumes:
  db_data:
